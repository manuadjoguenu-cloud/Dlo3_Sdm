<main class="actualites-box">

<div class="modale-fond" id="modale-fond" hidden>
  <div class="modale" role="dialog" aria-modal="true" aria-labelledby="modale-titre">
    <button class="modale-fermer" id="modale-fermer" aria-label="Fermer l'article">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <p class="modale-date" id="modale-date"></p>
    <h3 id="modale-titre"></h3>
    <p id="modale-contenu"></p>
  </div>
</div>

<script>
  // Chaque actualité : { id, date, titre, extrait, contenu }
  // - "date" : au format libre, ex. "15 août 2026".
  // - "extrait" : une ou deux phrases visibles dans la liste.
  // - "contenu" : le texte complet, affiché au clic sur l'article.
  // Ajoute/retire des entrées librement, la plus récente en premier.
  const actualites = [
    // Ajoute ici une entrée par actualité, ex. :
    // { id: "a1", date: "15 août 2026", titre: "...", extrait: "...", contenu: "..." },
  ];

  const liste = document.getElementById("liste");
  const messageVide = document.getElementById("message-vide");
  const sousTitreEl = document.getElementById("sous-titre");

  sousTitreEl.textContent = actualites.length > 0
    ? `${actualites.length} actualités — cliquez sur un article pour le lire en entier.`
    : "Les dernières nouvelles du DLO3 — revenez bientôt.";

  function rendreListe() {
    liste.innerHTML = actualites.map(a => `
      <article class="actu" data-id="${a.id}" tabindex="0" role="button" aria-haspopup="dialog" aria-label="Lire l'article : ${a.titre}">
        <span class="actu-date">${a.date}</span>
        <h2 class="actu-titre">${a.titre}</h2>
        <p class="actu-extrait">${a.extrait}</p>
        <span class="actu-lire">Lire la suite →</span>
      </article>
    `).join("");

    messageVide.style.display = actualites.length === 0 ? "block" : "none";
  }

  rendreListe();

  // ---------- Fiche article (modale) ----------
  const modaleFond = document.getElementById("modale-fond");
  const modaleDate = document.getElementById("modale-date");
  const modaleTitre = document.getElementById("modale-titre");
  const modaleContenu = document.getElementById("modale-contenu");
  let dernierFocus = null;

  function ouvrirArticle(id) {
    const a = actualites.find(x => x.id === id);
    if (!a) return;

    modaleDate.textContent = a.date;
    modaleTitre.textContent = a.titre;
    modaleContenu.textContent = a.contenu;

    dernierFocus = document.activeElement;
    modaleFond.hidden = false;
    document.body.style.overflow = "hidden";
    document.getElementById("modale-fermer").focus();
  }

  function fermerArticle() {
    modaleFond.hidden = true;
    document.body.style.overflow = "";
    if (dernierFocus) dernierFocus.focus();
  }

  liste.addEventListener("click", e => {
    const actu = e.target.closest(".actu");
    if (actu) ouvrirArticle(actu.dataset.id);
  });
  liste.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const actu = e.target.closest(".actu");
    if (!actu) return;
    e.preventDefault();
    ouvrirArticle(actu.dataset.id);
  });
  document.getElementById("modale-fermer").addEventListener("click", fermerArticle);
  modaleFond.addEventListener("click", e => { if (e.target === modaleFond) fermerArticle(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !modaleFond.hidden) fermerArticle();
  });
</script>
